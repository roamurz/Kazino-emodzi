<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Эмодзи-Казино</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #121216;
      --bg-inset: #18181d;
      --border-subtle: #27272f;
      --border-active: #52525b;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-wrapper {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 780px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Карточки */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 11px 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* 1. Верхняя панель */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .balance-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .balance-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
    }

    .balance-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .balance-amount {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .balance-delta {
      font-size: 11px;
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .balance-delta.show-pos {
      opacity: 1;
      color: #34d399;
    }

    .balance-delta.show-neg {
      opacity: 1;
      color: #f87171;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      background-color: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .bet-controls {
      display: flex;
      align-items: center;
      background-color: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
      min-width: 0;
    }

    .bet-pill {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 7px;
      border-radius: 9px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .bet-pill:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .bet-pill.active {
      background-color: #27272a;
      color: var(--text-primary);
    }

    .bet-pill:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .custom-bet-input {
      width: 50px;
      padding: 5px 4px;
      border-radius: 9px;
      background-color: #111115;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      outline: none;
      user-select: text;
      -moz-appearance: textfield;
    }

    .custom-bet-input::-webkit-inner-spin-button,
    .custom-bet-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .custom-bet-input::placeholder {
      color: var(--text-muted);
    }

    .custom-bet-input.active {
      background-color: #27272a;
      border-color: #71717a;
    }

    .custom-bet-input.invalid {
      border-color: var(--accent-red);
      color: #fca5a5;
    }

    /* 2. Панель сложности */
    .difficulty-card {
      margin-bottom: 10px;
    }

    .diff-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .diff-title {
      font-size: 13px;
      font-weight: 600;
      color: #d4d4d8;
    }

    .diff-title strong {
      font-size: 16px;
      font-weight: 900;
      color: var(--text-primary);
      margin-left: 4px;
    }

    .payout-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 9px;
      background-color: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.28);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
      margin: 4px 0;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: #27272a;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #fafafa;
      margin-top: -7px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      transition: transform 0.12s ease;
    }

    input[type="range"]:not(:disabled)::-webkit-slider-thumb:active {
      transform: scale(1.16);
    }

    input[type="range"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .diff-footer {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(39, 39, 47, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .active-emojis {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      line-height: 1;
      overflow: hidden;
    }

    .chance-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 3. Три квадратных слота */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .reel-box {
      aspect-ratio: 1 / 1;
      background-color: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.6);
      transition: border-color 0.2s, background-color 0.2s;
    }

    .reel-symbol {
      font-size: clamp(46px, 14vw, 62px);
      line-height: 1;
      display: inline-block;
      will-change: transform, filter;
    }

    .reel-spinning {
      filter: blur(0.6px);
      transform: scale(0.94);
      opacity: 0.92;
    }

    @keyframes popLand {
      0% { transform: translateY(-14px) scale(0.84); filter: blur(0.4px); }
      65% { transform: translateY(4px) scale(1.08); filter: blur(0); }
      100% { transform: translateY(0) scale(1); filter: blur(0); }
    }

    .reel-landed {
      animation: popLand 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes suspenseShake {
      0%, 100% {
        border-color: #ef4444;
        box-shadow: 0 0 26px rgba(239, 68, 68, 0.55), inset 0 0 14px rgba(239, 68, 68, 0.35);
        transform: scale(1.03) translate(-1.5px, 1px) rotate(-0.8deg);
      }
      25% {
        border-color: #f59e0b;
        box-shadow: 0 0 36px rgba(245, 158, 11, 0.85), inset 0 0 20px rgba(245, 158, 11, 0.45);
        transform: scale(1.05) translate(1.5px, -1px) rotate(0.8deg);
      }
      50% {
        border-color: #dc2626;
        box-shadow: 0 0 42px rgba(220, 38, 38, 0.95), inset 0 0 22px rgba(220, 38, 38, 0.5);
        transform: scale(1.04) translate(-1px, -1.5px) rotate(-0.5deg);
      }
      75% {
        border-color: #fde047;
        box-shadow: 0 0 34px rgba(250, 204, 21, 0.8), inset 0 0 18px rgba(250, 204, 21, 0.4);
        transform: scale(1.05) translate(1px, 1.5px) rotate(0.6deg);
      }
    }

    .reel-box.suspense {
      animation: suspenseShake 0.16s infinite ease-in-out;
      background-color: rgba(153, 27, 27, 0.24);
    }

    @keyframes winPulse {
      0%, 100% { border-color: rgba(52, 211, 153, 0.9); box-shadow: 0 0 22px rgba(16, 185, 129, 0.35); }
      50% { border-color: #a7f3d0; box-shadow: 0 0 36px rgba(16, 185, 129, 0.65); }
    }

    .reel-box.win {
      animation: winPulse 1.15s infinite ease-in-out;
      background-color: rgba(16, 185, 129, 0.14);
    }

    /* 4. Кнопки управления (ровно 20px под слотами) */
    .spin-btn {
      margin-top: 20px;
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 18px;
      background-color: #fafafa;
      color: #09090b;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.08);
      transition: transform 0.12s, background-color 0.15s, opacity 0.15s;
    }

    .spin-btn:hover:not(:disabled) {
      background-color: #e4e4e7;
    }

    .spin-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .spin-btn:disabled {
      background-color: #27272a;
      color: #71717a;
      cursor: not-allowed;
      box-shadow: none;
    }

    .secondary-btn {
      margin-top: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 14px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: #d4d4d8;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .secondary-btn:hover:not(:disabled) {
      background-color: var(--bg-inset);
      border-color: var(--border-active);
    }

    .secondary-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .secondary-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    @keyframes dodepGlow {
      0%, 100% { border-color: rgba(245, 158, 11, 0.45); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.15); }
      50% { border-color: rgba(251, 191, 36, 0.95); box-shadow: 0 0 16px 2px rgba(245, 158, 11, 0.25); }
    }

    .secondary-btn.attention {
      animation: dodepGlow 1.5s infinite ease-in-out;
      color: #fde68a;
    }

    .skip-btn {
      margin-top: 8px;
      width: 100%;
      padding: 9px 14px;
      border-radius: 13px;
      background-color: rgba(18, 18, 22, 0.9);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .skip-btn.active {
      background-color: rgba(245, 158, 11, 0.14);
      border-color: rgba(251, 191, 36, 0.75);
      color: #fde68a;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.16);
    }

    /* 5. Статусная строка */
    .status-bar {
      min-height: 26px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status-text {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .status-text.win { color: #34d399; }
    .status-text.info { color: #fcd34d; }
    .status-text.error { color: #f87171; }
    .hidden { display: none !important; }

    /* Виньетка саспенса и полноэкранные вспышки */
    .vignette-layer {
      position: fixed;
      inset: 0;
      z-index: 9990;
      pointer-events: none;
    }

    @keyframes vignettePulse {
      0%, 100% {
        box-shadow: inset 0 0 75px 30px rgba(127, 29, 29, 0.78), inset 0 0 135px 60px rgba(0, 0, 0, 0.92);
      }
      50% {
        box-shadow: inset 0 0 105px 44px rgba(220, 38, 38, 0.9), inset 0 0 170px 76px rgba(0, 0, 0, 0.97);
      }
    }

    .vignette-layer.active {
      animation: vignettePulse 0.6s infinite ease-in-out;
    }

    .combo-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .combo-text {
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
    }

    @keyframes comboPop {
      0% { opacity: 0; transform: scale(0.35) rotate(-6deg); }
      22% { opacity: 1; transform: scale(1.12) rotate(2deg); }
      38% { opacity: 1; transform: scale(1) rotate(0deg); }
      76% { opacity: 1; transform: scale(1.04) translateY(-4px); }
      100% { opacity: 0; transform: scale(1.28) translateY(-16px); }
    }

    .combo-anim {
      animation: comboPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes comboJackpot {
      0% { opacity: 0; transform: scale(0.25) rotate(-10deg); }
      18% { opacity: 1; transform: scale(1.22) rotate(3deg); }
      32% { opacity: 1; transform: scale(1.05) rotate(-1deg); }
      78% { opacity: 1; transform: scale(1.1) translateY(-6px); }
      100% { opacity: 0; transform: scale(1.42) translateY(-22px); }
    }

    .combo-jackpot-anim {
      animation: comboJackpot 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-5px, 4px) rotate(-0.6deg); }
      30% { transform: translate(5px, -4px) rotate(0.6deg); }
      45% { transform: translate(-4px, -3px) rotate(-0.4deg); }
      60% { transform: translate(4px, 3px) rotate(0.4deg); }
      75% { transform: translate(-2px, 2px) rotate(-0.2deg); }
    }

    .shake {
      animation: screenShake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Модальные окна */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9995;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-card {
      width: 100%;
      max-width: 410px;
      max-height: 90dvh;
      overflow-y: auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .modal-subtitle {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Рулетка Додепа */
    .roulette-viewport {
      position: relative;
      width: 100%;
      height: 122px;
      background-color: #09090b;
      border: 2px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      margin: 12px 0;
    }

    .roulette-pointer-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #fbbf24;
      pointer-events: none;
    }

    .roulette-pointer-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 10px solid #fbbf24;
      pointer-events: none;
    }

    .roulette-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
      background-color: rgba(251, 191, 36, 0.85);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.9);
      z-index: 15;
      pointer-events: none;
    }

    .roulette-fade-left, .roulette-fade-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 34px;
      z-index: 10;
      pointer-events: none;
    }

    .roulette-fade-left {
      left: 0;
      background: linear-gradient(to right, #09090b, transparent);
    }

    .roulette-fade-right {
      right: 0;
      background: linear-gradient(to left, #09090b, transparent);
    }

    .roulette-track {
      display: flex;
      align-items: center;
      height: 100%;
      will-change: transform;
    }

    .roulette-item {
      width: 108px;
      height: 102px;
      margin: 0 4px;
      flex-shrink: 0;
      border-radius: 14px;
      border: 2px solid #3f3f46;
      background-color: #18181d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 6px;
      text-align: center;
    }

    .roulette-item.gold { border-color: rgba(251, 191, 36, 0.85); background-color: rgba(245, 158, 11, 0.14); }
    .roulette-item.purple { border-color: rgba(192, 132, 252, 0.8); background-color: rgba(168, 85, 247, 0.14); }
    .roulette-item.blue { border-color: rgba(56, 189, 248, 0.75); background-color: rgba(14, 165, 233, 0.14); }
    .roulette-item.green { border-color: rgba(52, 211, 153, 0.75); background-color: rgba(16, 185, 129, 0.14); }

    .r-icon { font-size: 22px; line-height: 1; }
    .r-name {
      font-size: 10px;
      font-weight: 600;
      line-height: 1.15;
      color: #e4e4e7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .r-val { font-size: 12px; font-weight: 900; color: #34d399; }

    .roulette-result {
      background-color: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      margin-bottom: 10px;
    }

    .odds-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }

    .odds-cell {
      background-color: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 10px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      overflow: hidden;
    }

    .odds-cell span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .odds-cell span:last-child {
      font-weight: 800;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .amber-btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 15px;
      background-color: #fbbf24;
      color: #09090b;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .amber-btn:hover:not(:disabled) {
      background-color: #fcd34d;
    }

    .amber-btn:disabled {
      background-color: #27272a;
      color: #71717a;
      cursor: not-allowed;
    }

    /* Проверка на трезвость */
    .quiz-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .quiz-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background-color: rgba(168, 85, 247, 0.16);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.32);
    }

    .quiz-counter {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .quiz-stakes-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      // --- Безопасный Web Audio API ---
      const SoundFX = (() => {
        let ctx = null;
        let enabled = true;
        let suspenseLoop = null;

        function getCtx() {
          if (!enabled) return null;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            if (!ctx) ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
            return ctx;
          } catch (_) {
            return null;
          }
        }

        function tick(freq = 600, vol = 0.04) {
          try {
            const c = getCtx();
            if (!c) return;
            const now = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.45, now + 0.03);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + 0.04);
          } catch (_) {}
        }

        function stopSound(reelIdx) {
          try {
            const c = getCtx();
            if (!c) return;
            const now = c.currentTime;
            const freqs = [190, 260, 340];
            const f = freqs[reelIdx] || 220;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now);
            osc.frequency.exponentialRampToValueAtTime(f * 0.45, now + 0.14);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + 0.16);
          } catch (_) {}
        }

        function startSuspense() {
          stopSuspense();
          try {
            const c = getCtx();
            if (!c) return;
            const now = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            const filter = c.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(52, now);
            osc.frequency.linearRampToValueAtTime(98, now + 3.6);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(170, now);
            filter.frequency.linearRampToValueAtTime(420, now + 3.6);

            gain.gain.setValueAtTime(0.02, now);
            gain.gain.linearRampToValueAtTime(0.13, now + 3.4);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(c.destination);
            osc.start(now);

            let interval = 420;
            let timer = null;
            let active = true;

            const beat = () => {
              if (!active) return;
              try {
                const t = c.currentTime;
                const hb = c.createOscillator();
                const hbGain = c.createGain();
                hb.type = 'sine';
                hb.frequency.setValueAtTime(85, t);
                hb.frequency.exponentialRampToValueAtTime(34, t + 0.16);
                hbGain.gain.setValueAtTime(0.22, t);
                hbGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                hb.connect(hbGain);
                hbGain.connect(c.destination);
                hb.start(t);
                hb.stop(t + 0.19);
              } catch (_) {}
              interval = Math.max(150, interval * 0.87);
              timer = setTimeout(beat, interval);
            };

            beat();
            suspenseLoop = {
              stop: () => {
                active = false;
                if (timer) clearTimeout(timer);
                try {
                  gain.gain.setTargetAtTime(0.0001, c.currentTime, 0.03);
                  osc.stop(c.currentTime + 0.08);
                } catch (_) {}
              }
            };
          } catch (_) {}
        }

        function stopSuspense() {
          if (suspenseLoop) {
            suspenseLoop.stop();
            suspenseLoop = null;
          }
        }

        function jackpot() {
          stopSuspense();
          try {
            const c = getCtx();
            if (!c) return;
            const now = c.currentTime;
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
              const osc = c.createOscillator();
              const gain = c.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, now + i * 0.055);
              gain.gain.setValueAtTime(0.15, now + i * 0.055);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.65);
              osc.connect(gain);
              gain.connect(c.destination);
              osc.start(now + i * 0.055);
              osc.stop(now + i * 0.055 + 0.68);
            });
          } catch (_) {}
        }

        function miss() {
          stopSuspense();
          try {
            const c = getCtx();
            if (!c) return;
            const now = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(145, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + 0.34);
          } catch (_) {}
        }

        function toggle() {
          enabled = !enabled;
          if (!enabled) stopSuspense();
          else getCtx();
          return enabled;
        }

        return { getCtx, tick, stopSound, startSuspense, stopSuspense, jackpot, miss, toggle };
      })();

      // --- Базовые утилиты ---
      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, Math.max(0, ms)));
      }

      function getActivePool() {
        const n = Math.max(2, Math.min(EMOJIS.length, Number(emojiCount) || 5));
        return EMOJIS.slice(0, n);
      }

      function getMultiplier() {
        const n = Math.max(2, Math.min(EMOJIS.length, Number(emojiCount) || 5));
        return n * n;
      }

      function getBetAmount() {
        if (betMode === 'MAX') return balance > 0 ? balance : 5;
        if (betMode === 'CUSTOM') {
          const val = Math.floor(Number(customBetAmount));
          return Number.isFinite(val) && val >= 1 ? val : 0;
        }
        return betMode;
      }

      function pickDifferentEmoji(pool, prevEmoji) {
        if (pool.length <= 1) return pool[0];
        let next = pool[Math.floor(Math.random() * pool.length)];
        if (next === prevEmoji) {
          const idx = pool.indexOf(prevEmoji);
          next = pool[(idx + 1) % pool.length];
        }
        return next;
      }

      function formatChance(n) {
        const pct = (1 / (n * n)) * 100;

      // Плавное замедление барабана по степенной кривой (от ~110 мс до ~550 мс)
      async function spinReelSmooth(reelIndex, pool, durationMs, startDelayMs, endDelayMs) {
        const symbolEl = reelSymbols[reelIndex];
        const startTime = performance.now();
        let currentEmoji = symbolEl.textContent;

        while (true) {
          const elapsed = performance.now() - startTime;
          const remaining = durationMs - elapsed;
          if (remaining <= 0) break;

          const progress = Math.min(1, elapsed / durationMs);
          const eased = Math.pow(progress, 2.3);
          const stepDelay = Math.round(startDelayMs + (endDelayMs - startDelayMs) * eased);

          if (remaining <= stepDelay * 0.7) {
            await sleep(remaining);
            break;
          }

          currentEmoji = pickDifferentEmoji(pool, currentEmoji);
          symbolEl.textContent = currentEmoji;

          const pitch = Math.max(300, 650 - reelIndex * 70 - Math.round(progress * 200));
          SoundFX.tick(pitch, 0.04 + progress * 0.015);

          await sleep(stepDelay);
        }
      }

      function landReel(reelIndex, finalEmoji) {
        const symbolEl = reelSymbols[reelIndex];
        symbolEl.classList.remove('reel-spinning', 'reel-landed');
        symbolEl.textContent = finalEmoji;
        void symbolEl.offsetWidth;
        symbolEl.classList.add('reel-landed');
        SoundFX.stopSound(reelIndex);
      }

      // Обновление всего интерфейса
      function updateUI() {
        const bet = getBetAmount();
        const mult = getMultiplier();
        const pool = getActivePool();
        const canAfford = bet >= 1 && balance >= bet;
        const locked = isSpinning || isCaptchaActive || isRouletteSpinning;

        balanceValue.textContent = `$${balance}`;
        nDisplay.textContent = emojiCount;
        payoutBadge.textContent = `x${mult} ($${bet * mult})`;
        chanceBadge.textContent = `Шанс: ${formatChance(emojiCount)} (x${mult})`;
        activeEmojisRow.innerHTML = pool.map(e => `<span>${e}</span>`).join('');

        betPills.forEach(pill => {
          const raw = pill.dataset.bet;
          const val = raw === 'MAX' ? 'MAX' : Number(raw);
          pill.classList.toggle('active', betMode === val);
          pill.disabled = locked;
        });

        customBetInput.disabled = locked;
        customBetInput.classList.toggle('active', betMode === 'CUSTOM');
        customBetInput.classList.toggle('invalid', betMode === 'CUSTOM' && (bet < 1 || bet > balance));

        nSlider.disabled = locked;

        if (isSpinning) {
          spinBtn.disabled = true;
          spinBtn.textContent = 'Крутим...';
        } else if (betMode === 'CUSTOM' && bet < 1) {
          spinBtn.disabled = true;
          spinBtn.textContent = 'Введите ставку';
        } else if (!canAfford) {
          spinBtn.disabled = true;
          spinBtn.textContent = 'Не хватает на ставку';
        } else {
          spinBtn.disabled = locked;
          spinBtn.textContent = `Крутить за $${bet}`;
        }

        const secLeft = Math.max(0, Math.ceil((dodepCooldownEnd - Date.now()) / 1000));
        const onCooldown = secLeft > 0;
        dodepBtn.disabled = locked || onCooldown;
        dodepBtn.innerHTML = onCooldown
          ? `<span>⏳ Додеп через ${secLeft}с</span>`
          : `<span>💸 Додеп</span>`;
        dodepBtn.classList.toggle('attention', !canAfford && !isSpinning && !onCooldown);

        fastSkipBtn.setAttribute('aria-pressed', String(fastSkipEnabled));
        fastSkipBtn.classList.toggle('active', fastSkipEnabled);
        fastSkipBtn.innerHTML = fastSkipEnabled
          ? '<span>⚡ Пропуск при промахе: ВКЛ</span>'
          : '<span>⚡ Пропуск при промахе: ВЫКЛ</span>';
      }

      // --- Главный цикл спина с гарантированной защитой try / finally ---
      async function spin() {
        if (isSpinning || isCaptchaActive || isRouletteSpinning) return;

        SoundFX.getCtx();
        const bet = getBetAmount();

        if (bet < 1 || balance < bet) {
          showStatus('Недостаточно средств — нажми «Додеп»', 'info');
          updateUI();
          return;
        }

        isSpinning = true;
        hideStatus();

        try {
          balance -= bet;
          flashDelta(-bet);

          const pool = getActivePool();
          // Сразу определяем 3 независимых итоговых эмодзи с шансом 1/N каждый
          const results = [
            pool[Math.floor(Math.random() * pool.length)],
            pool[Math.floor(Math.random() * pool.length)],
            pool[Math.floor(Math.random() * pool.length)]
          ];

          const firstTwoMatch = results[0] === results[1];
          const isJackpot = firstTwoMatch && results[1] === results[2];

          reelBoxes.forEach((box, idx) => {
            box.classList.remove('win', 'suspense');
            reelSymbols[idx].classList.remove('reel-landed');
            reelSymbols[idx].classList.add('reel-spinning');
            reelSymbols[idx].textContent = pickDifferentEmoji(pool, reelSymbols[idx].textContent);
          });

          updateUI();

          // 1-й слот: останавливается через 2.2 сек -> зелёный 'х1'
          await spinReelSmooth(0, pool, 2200, 110, 440);
          landReel(0, results[0]);
          showComboSplash(1);

          // 2-й слот: останавливается через 4.2 сек (+2.0 сек) -> красный 'х2!' при совпадении
          await spinReelSmooth(1, pool, 2000, 110, 490);
          landReel(1, results[1]);
          if (firstTwoMatch) {
            showComboSplash(2);
          }

          // 3-й слот:
          // - Если первые два совпали -> саспенс до 8.0 сек (+3.8 сек) с багровой виньеткой
          // - Если первые два разные и включён фаст-скип -> моментальная фиксация за 150 мс
          // - Обычный режим -> остановка на 5.4 сек (+1.2 сек)
          if (firstTwoMatch) {
            setSuspense(true);
            await spinReelSmooth(2, pool, 3800, 120, 550);
            setSuspense(false);
            landReel(2, results[2]);
          } else if (fastSkipEnabled) {
            await sleep(150);
            landReel(2, results[2]);
          } else {
            await spinReelSmooth(2, pool, 1200, 115, 440);
            landReel(2, results[2]);
          }

          if (isJackpot) {
            const winAmount = bet * getMultiplier();
            balance += winAmount;
            flashDelta(winAmount);
            reelBoxes.forEach(box => box.classList.add('win'));
            SoundFX.jackpot();
            showComboSplash(3);
            showStatus(`Победа! +$${winAmount}`, 'win');
          } else if (firstTwoMatch) {
            SoundFX.miss();
            showStatus('Почти! Не хватило одного символа', 'error');
          }

          spinsUntilCaptcha -= 1;
        } catch (err) {
          console.error('Ошибка в цикле вращения:', err);
          setSuspense(false);
        } finally {
          isSpinning = false;
          updateUI();

          if (spinsUntilCaptcha <= 0) {
            setTimeout(() => openSobrietyModal(), 600);
          }
        }
      }

      // --- Рулетка Додепа ---
      function startDodepCooldown(sec = 60) {
        dodepCooldownEnd = Date.now() + sec * 1000;
        if (dodepIntervalId) clearInterval(dodepIntervalId);
        updateUI();

        dodepIntervalId = setInterval(() => {
          if (Date.now() >= dodepCooldownEnd) {
            clearInterval(dodepIntervalId);
            dodepIntervalId = null;
            dodepCooldownEnd = 0;
          }
          updateUI();
        }, 500);
      }

      function pickWeightedDodep() {
        const roll = Math.random() * 100;
        let acc = 0;
        for (const item of DODEP_ITEMS) {
          acc += item.chance;
          if (roll < acc) return item;
        }
        return DODEP_ITEMS[DODEP_ITEMS.length - 1];
      }

      function renderOddsLegend() {
        rouletteOddsLegend.innerHTML = DODEP_ITEMS.map(item => `
          <div class="odds-cell" title="${item.title}">
            <span>${item.icon} $${item.reward}</span>
            <span>${item.chance}%</span>
          </div>
        `).join('');
      }

      function renderRouletteStrip(items) {
        rouletteTrack.innerHTML = items.map(item => `
          <div class="roulette-item ${item.rarity}">
            <span class="r-icon">${item.icon}</span>
            <span class="r-name">${item.title}</span>
            <span class="r-val">+$${item.reward}</span>
          </div>
        `).join('');
      }

      function openDodepModal() {
        if (isSpinning || isCaptchaActive || isRouletteSpinning) return;
        if (Date.now() < dodepCooldownEnd) return;

        SoundFX.getCtx();
        renderOddsLegend();
        renderRouletteStrip(Array.from({ length: 12 }, () => pickWeightedDodep()));

        rouletteTrack.style.transform = 'translate3d(0px, 0, 0)';
        rouletteResultBox.classList.add('hidden');
        spinRouletteBtn.disabled = false;
        spinRouletteBtn.textContent = 'Крутить рулетку';
        spinRouletteBtn.dataset.state = 'ready';
        closeDodepBtn.disabled = false;

        dodepModal.classList.remove('hidden');
      }

      function closeDodepModal() {
        if (isRouletteSpinning) return;
        dodepModal.classList.add('hidden');
      }

      function spinDodepRoulette() {
        if (isRouletteSpinning) return;
        if (spinRouletteBtn.dataset.state === 'done') {
          closeDodepModal();
          return;
        }

        SoundFX.getCtx();
        isRouletteSpinning = true;
        updateUI();

        spinRouletteBtn.disabled = true;
        spinRouletteBtn.textContent = 'Крутим ленту...';
        closeDodepBtn.disabled = true;
        rouletteResultBox.classList.add('hidden');

        const TOTAL_CARDS = 48;
        const WIN_IDX = 38;
        const CARD_WIDTH = 116; // 108px + 8px margins

        const winner = pickWeightedDodep();
        const strip = Array.from({ length: TOTAL_CARDS }, (_, i) =>
          i === WIN_IDX ? winner : pickWeightedDodep()
        );

        renderRouletteStrip(strip);

        const viewW = rouletteViewport.clientWidth || 340;
        const jitter = randomInt(-26, 26);
        const targetX = WIN_IDX * CARD_WIDTH + CARD_WIDTH / 2 - viewW / 2 + jitter;

        rouletteTrack.style.transform = 'translate3d(0px, 0, 0)';
        const duration = 4500;
        const t0 = performance.now();
        let lastIdx = -1;

        function frame(now) {
          const elapsed = now - t0;
          const p = Math.min(1, elapsed / duration);
          const eased = 1 - Math.pow(1 - p, 4);
          const curX = targetX * eased;

          rouletteTrack.style.transform = `translate3d(${-curX}px, 0, 0)`;

          const cardIdx = Math.floor((curX + viewW / 2) / CARD_WIDTH);
          if (cardIdx !== lastIdx) {
            lastIdx = cardIdx;
            SoundFX.tick(550 - Math.round(p * 200), 0.04);
          }

          if (p < 1) {
            requestAnimationFrame(frame);
          } else {
            isRouletteSpinning = false;
            balance += winner.reward;
            flashDelta(winner.reward);
            startDodepCooldown(60);

            if (winner.reward >= 250) SoundFX.jackpot();
            else SoundFX.stopSound(2);

            rouletteResultTitle.textContent = `${winner.icon} ${winner.title}`;
            rouletteResultAmount.textContent = `+$${winner.reward}`;
            rouletteResultBox.classList.remove('hidden');

            spinRouletteBtn.disabled = false;
            spinRouletteBtn.textContent = `Забрать +$${winner.reward}`;
            spinRouletteBtn.dataset.state = 'done';
            closeDodepBtn.disabled = false;

            showStatus(`${winner.title}: +$${winner.reward}`, 'info');
            updateUI();
          }
        }

        requestAnimationFrame(frame);
      }

      // --- Проверка на трезвость (50 вопросов по играм без повторений) ---
      function shuffleDeck() {
        const arr = Array.from({ length: QUIZ_BANK.length }, (_, i) => i);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        quizDeck = arr;
        quizPointer = 0;
      }

      function renderNextQuestion() {
        isQuizValidating = false;
        quizFeedbackText.classList.add('hidden');

        if (quizDeck.length === 0 || quizPointer >= quizDeck.length) {
          shuffleDeck();
        }

        const num = quizPointer + 1;
        const qIndex = quizDeck[quizPointer];
        quizPointer += 1;

        const item = QUIZ_BANK[qIndex];
        quizCounterBadge.textContent = `Вопрос ${num}/${QUIZ_BANK.length}`;
        quizQuestionText.textContent = item.question;

        const variants = item.options.map((text, idx) => ({
          text,
          isRight: idx === item.correct
        }));

        for (let i = variants.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [variants[i], variants[j]] = [variants[j], variants[i]];
        }

        quizOptionsList.innerHTML = '';
        variants.forEach(v => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'quiz-option-btn';
          btn.textContent = v.text;
          btn.addEventListener('click', () => handleAnswer(btn, v.isRight));
          quizOptionsList.appendChild(btn);
        });
      }

      function openSobrietyModal() {
        isCaptchaActive = true;
        dodepModal.classList.add('hidden');
        renderNextQuestion();
        sobrietyModal.classList.remove('hidden');
        updateUI();
      }

      function handleAnswer(btn, isRight) {
        if (isQuizValidating) return;
        isQuizValidating = true;

        quizOptionsList.querySelectorAll('button').forEach(b => (b.disabled = true));

        if (isRight) {
          SoundFX.jackpot();
          balance += 5;
          flashDelta(5);
          updateUI();

          btn.classList.add('correct');
          quizFeedbackText.textContent = 'Верно! Трезвость подтверждена: +$5';
          quizFeedbackText.style.color = '#34d399';
          quizFeedbackText.classList.remove('hidden');

          setTimeout(() => {
            sobrietyModal.classList.add('hidden');
            isCaptchaActive = false;
            isQuizValidating = false;
            spinsUntilCaptcha = randomInt(5, 10);
            updateUI();
          }, 1100);
        } else {
          SoundFX.miss();
          const penalty = Math.min(10, balance);
          balance = Math.max(0, balance - 10);
          if (penalty > 0) flashDelta(-penalty);
          updateUI();

          btn.classList.add('wrong');
          sobrietyBox.classList.remove('wiggle');
          void sobrietyBox.offsetWidth;
          sobrietyBox.classList.add('wiggle');

          quizFeedbackText.textContent = penalty > 0
            ? `Ошибка! Штраф -$${penalty}. Ответь на следующий вопрос:`
            : 'Ошибка! Баланс уже $0. Ответь на следующий вопрос:';
          quizFeedbackText.style.color = '#f87171';
          quizFeedbackText.classList.remove('hidden');

          setTimeout(() => {
            renderNextQuestion();
          }, 1250);
        }
      }

      // --- Слушатели событий ---
      soundToggleBtn.addEventListener('click', () => {
        const on = SoundFX.toggle();
        soundToggleBtn.textContent = on ? '🔊' : '🔇';
      });

      betPills.forEach(pill => {
        pill.addEventListener('click', () => {
          if (isSpinning || isCaptchaActive || isRouletteSpinning) return;
          const raw = pill.dataset.bet;
          betMode = raw === 'MAX' ? 'MAX' : Number(raw);
          customBetInput.value = '';
          hideStatus();
          updateUI();
        });
      });

      customBetInput.addEventListener('focus', () => {
        if (isSpinning || isCaptchaActive || isRouletteSpinning) return;
        betMode = 'CUSTOM';
        if (!customBetInput.value) {
          customBetInput.value = String(Math.max(1, Math.min(customBetAmount, balance || 1)));
        }
        customBetAmount = Math.floor(Number(customBetInput.value)) || 0;
        updateUI();
      });

      customBetInput.addEventListener('input', () => {
        if (isSpinning || isCaptchaActive || isRouletteSpinning) return;
        betMode = 'CUSTOM';
        const digits = customBetInput.value.replace(/[^\d]/g, '');
        if (customBetInput.value !== digits) customBetInput.value = digits;
        customBetAmount = digits ? parseInt(digits, 10) : 0;
        hideStatus();
        updateUI();
      });

      nSlider.addEventListener('input', (e) => {
        if (isSpinning || isCaptchaActive || isRouletteSpinning) return;
        emojiCount = Number(e.target.value);
        const pool = getActivePool();

        // Сразу синхронизируем символы в слотах с новым пулом EMOJIS.slice(0, N)
        reelBoxes.forEach(box => box.classList.remove('win', 'suspense'));
        reelSymbols.forEach((sym, idx) => {
          if (!pool.includes(sym.textContent)) {
            sym.textContent = pool[idx % pool.length];
          }
        });

        hideStatus();
        updateUI();
      });

      spinBtn.addEventListener('click', spin);
      dodepBtn.addEventListener('click', openDodepModal);

      fastSkipBtn.addEventListener('click', () => {
        SoundFX.getCtx();
        fastSkipEnabled = !fastSkipEnabled;
        SoundFX.tick(fastSkipEnabled ? 780 : 420, 0.05);
        updateUI();
      });

      closeDodepBtn.addEventListener('click', closeDodepModal);
      spinRouletteBtn.addEventListener('click', spinDodepRoulette);

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !isSpinning && !isCaptchaActive && !isRouletteSpinning) {
          if (document.activeElement === customBetInput) return;
          e.preventDefault();
          spin();
        }
      });

      // Инициализация при старте
      shuffleDeck();
      updateUI();
    });
  </script>
</body>
</html>
